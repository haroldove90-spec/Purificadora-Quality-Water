<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Purificadora Quality Water</title>
    <script>
      (function() {
        // Suppress benign connection, cross-origin script error, or build system HMR warnings
        var benignPatterns = [
          'WebSocket', 'websocket', 'ws://', 'wss://', 'HMR', 'Script error', 'Script error.', '[vite]', 'vite', 'connection'
        ];
        function matchPattern(str) {
          if (!str) return true; // Si es un mensaje vacío, suele ser un "Script error." sin detalles por seguridad de origen cruzado. Silenciamos para mayor seguridad.
          var s = String(str);
          for (var i = 0; i < benignPatterns.length; i++) {
            if (s.indexOf(benignPatterns[i]) !== -1) {
              return true;
            }
          }
          return false;
        }

        // Definir window.onerror clásico que es el método más efectivo para interceptar "Script error."
        window.onerror = function(message, source, lineno, colno, error) {
          var msg = String(message || '');
          var src = String(source || '');
          if (!message || matchPattern(msg) || matchPattern(src)) {
            console.warn('Silenciando Script error o advertencia de origen cruzado benigna:', msg, src);
            return true; // Retornar true evita que el navegador reporte el error en consola
          }
          // De lo contrario, permitimos que se reporte normalmente
          return false;
        };

        window.addEventListener('error', function(event) {
          var msg = event.message || '';
          var file = event.filename || '';
          if (!msg || matchPattern(msg) || matchPattern(file)) {
            event.preventDefault();
            event.stopPropagation();
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          var reason = event.reason;
          var msg = reason ? (reason.message || reason.error_description || String(reason)) : '';
          if (matchPattern(msg)) {
            event.preventDefault();
            event.stopPropagation();
          }
        }, true);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
